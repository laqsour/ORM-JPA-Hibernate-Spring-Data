<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Liste des produits</title></head>
<body>
<section layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2>Liste des produits</h2>
        <a class="btn btn-success" th:href="@{/products/new}">+ Ajouter un produit</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/products}" method="get">
        <div class="col-sm-8 col-md-5">
            <input class="form-control" type="text" name="keyword" placeholder="Rechercher par nom..."
                   th:value="${keyword}">
        </div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Rechercher</button></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/products}">Réinitialiser</a></div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-dark">
                <tr><th>ID</th><th>Nom</th><th>Prix (DH)</th><th>Quantité</th><th>Description</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td th:text="${p.description}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-warning btn-sm" th:href="@{/products/edit/{id}(id=${p.id})}">Modifier</a>
                        <form class="d-inline" th:action="@{/products/delete/{id}(id=${p.id})}" method="post"
                              onsubmit="return confirm('Supprimer ce produit ?');">
                            <button class="btn btn-danger btn-sm" type="submit">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center py-4">Aucun produit trouvé.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
