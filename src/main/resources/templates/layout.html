<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | Gestion Produits">Gestion Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Gestion Produits</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/products}">Produits</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-light btn-sm" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <section layout:fragment="content"></section>
</main>
<footer class="text-center text-muted py-4">
    <small>Application Spring Boot - Gestion des produits</small>
</footer>
</body>
</html>
