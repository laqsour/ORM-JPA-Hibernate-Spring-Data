<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Gestion Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow-sm p-4" style="width:100%;max-width:420px">
        <h2 class="text-center mb-4">Connexion</h2>
        <div th:if="${param.error}" class="alert alert-danger">Nom d'utilisateur ou mot de passe incorrect.</div>
        <div th:if="${param.logout}" class="alert alert-success">Vous êtes déconnecté.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input class="form-control" type="text" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Se connecter</button>
        </form>
        <p class="text-muted small mt-3 mb-0">Compte de démonstration : oussama / Admin123!</p>
    </div>
</div>
</body>
</html>
